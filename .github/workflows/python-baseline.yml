name: Python Baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r research-os/requirements.txt pyyaml
      - name: Compile Python source
        run: python -m compileall -q tools v3
      - name: Run V3 unit tests
        env:
          PYTHONPATH: .:v3
        run: python -m unittest discover -s v3/tests -p "test_*.py" -v
