name: Baseline Truth Gate

on:
  pull_request:
    paths:
      - "current/BASELINE_TRUTH_CONTRACT.json"
      - "tools/verify_baseline_truth.py"
      - "tools/test_verify_baseline_truth.py"
      - ".github/workflows/baseline-truth-gate.yml"
  push:
    branches:
      - main
    paths:
      - "current/BASELINE_TRUTH_CONTRACT.json"
      - "tools/verify_baseline_truth.py"
      - "tools/test_verify_baseline_truth.py"
      - ".github/workflows/baseline-truth-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify immutable baseline truth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch authoritative baseline history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none \
            https://github.com/phakphoum38-stack/ENTERPRISE_API_ARCHITECTURE_LOGIC_TH.git \
            refs/heads/main:refs/remotes/baseline-truth/main

      - name: Verify immutable anchors against authoritative history
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_baseline_truth.py \
            --head "$GITHUB_SHA" \
            --truth-ref refs/remotes/baseline-truth/main

      - name: Run baseline verifier regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tools.test_verify_baseline_truth -v
