name: Learning Contract Tests

on:
  pull_request:
    paths:
      - 'owner_special/research_os_friend/**'
      - '.github/workflows/learning-contracts.yml'
  push:
    branches: ['main']
    paths:
      - 'owner_special/research_os_friend/**'
      - '.github/workflows/learning-contracts.yml'

permissions:
  contents: read

jobs:
  learning-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile learning boundary sources
        run: python -m compileall -q owner_special/research_os_friend
      - name: Run learning boundary tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s owner_special/research_os_friend -t . -p 'test_*.py' -v
