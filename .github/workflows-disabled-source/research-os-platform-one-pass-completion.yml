name: Research OS Platform One-Pass Completion

on:
  pull_request:
    paths:
      - 'current/RESEARCH_OS_PLATFORM_ONE_PASS_COMPLETION_CONTRACT.json'
      - 'current/RESEARCH_OS_PLATFORM_COMPONENT_INVENTORY.json'
      - 'tools/validate_research_os_platform_one_pass.py'
      - 'tools/test_research_os_platform_one_pass.py'
      - 'docs/RESEARCH_OS_PLATFORM_ONE_PASS_COMPLETION.md'
      - '.github/workflows/research-os-platform-one-pass-completion.yml'
      - 'current/RESEARCH_OS_UNIFIED_FINAL_GATE.yml'
      - 'tools/test_platform_spine.py'
      - 'tools/platform_spine.py'
      - 'current/RESEARCH_OS_PLATFORM_SPINE_ENGINE_CONTRACT.json'
      - 'current/RESEARCH_OS_PLATFORM_EVOLUTION_CONTRACT.json'
      - 'tools/validate_research_os_platform_evolution.py'
      - 'tools/test_validate_research_os_platform_evolution.py'
  push:
    branches: [main]
    paths:
      - 'current/RESEARCH_OS_PLATFORM_ONE_PASS_COMPLETION_CONTRACT.json'
      - 'current/RESEARCH_OS_PLATFORM_COMPONENT_INVENTORY.json'
      - 'tools/validate_research_os_platform_one_pass.py'
      - 'tools/test_research_os_platform_one_pass.py'
      - 'current/RESEARCH_OS_UNIFIED_FINAL_GATE.yml'
      - 'current/RESEARCH_OS_PLATFORM_EVOLUTION_CONTRACT.json'
      - 'tools/validate_research_os_platform_evolution.py'
      - 'tools/test_validate_research_os_platform_evolution.py'

jobs:
  platform-one-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate Platform Spine engine
        run: python tools/platform_spine.py --validate
      - name: Test Platform Spine engine
        run: python tools/test_platform_spine.py
      - name: Validate one-pass Platform spine
        run: python tools/validate_research_os_platform_one_pass.py
      - name: Validate Platform Evolution
        run: python tools/validate_research_os_platform_evolution.py
      - name: Test Platform Evolution
        run: python tools/test_validate_research_os_platform_evolution.py
      - name: Test one-pass Platform spine
        run: python tools/test_research_os_platform_one_pass.py
