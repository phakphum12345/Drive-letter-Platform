name: GUI Asset Validation

on:
  pull_request:
    paths:
      - 'design/**'
      - '.github/workflows/gui-asset-validation.yml'
  push:
    branches:
      - agent/v3.5-worker-pool-hardening
    paths:
      - 'design/**'
      - '.github/workflows/gui-asset-validation.yml'

permissions:
  contents: read

jobs:
  validate-gui-assets:
    name: Validate GUI assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Validate asset manifest
        run: python design/validate_assets.py

      - name: Run asset validator tests
        run: python -m pytest -q design/tests/test_validate_assets.py
