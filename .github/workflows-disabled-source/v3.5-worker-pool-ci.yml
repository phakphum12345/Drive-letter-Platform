name: V3.5 Worker Pool CI

on:
  push:
    branches:
      - agent/v3.5-worker-pool-hardening
    paths:
      - 'v3/worker_pool.py'
      - 'v3/tests/test_worker_pool.py'
      - 'v3/tests/test_worker_pool_shutdown.py'
      - 'v3/tests/test_worker_pool_timeout.py'
      - '.github/workflows/v3.5-worker-pool-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'v3/worker_pool.py'
      - 'v3/tests/test_worker_pool.py'
      - 'v3/tests/test_worker_pool_shutdown.py'
      - 'v3/tests/test_worker_pool_timeout.py'
      - '.github/workflows/v3.5-worker-pool-ci.yml'

permissions:
  contents: read

concurrency:
  group: v3.5-worker-pool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Run Worker Pool tests
        run: python -m unittest v3.tests.test_worker_pool v3.tests.test_worker_pool_shutdown v3.tests.test_worker_pool_timeout -v

      - name: Compile Worker Pool
        run: python -m py_compile v3/worker_pool.py
