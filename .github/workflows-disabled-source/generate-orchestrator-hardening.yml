name: Generate Orchestrator Hardening

on:
  push:
    branches: [agent/v3.5-worker-pool-hardening]
    paths:
      - '.github/workflows/generate-orchestrator.yml'
      - 'current/GENERATE_WORKFLOW_REGISTRY.yml'
      - 'tools/validate_generate_orchestrator.py'
      - 'tools/test_validate_generate_orchestrator.py'
  pull_request:
    paths:
      - '.github/workflows/generate-orchestrator.yml'
      - 'current/GENERATE_WORKFLOW_REGISTRY.yml'
      - 'tools/validate_generate_orchestrator.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-orchestrator-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate orchestrator invariants
        run: |
          python tools/validate_generate_orchestrator.py
          python -m unittest tools.test_validate_generate_orchestrator -v
