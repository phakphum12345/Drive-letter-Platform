name: Research OS Platform Production Certification
on:
  pull_request:
    paths:
      - 'current/RESEARCH_OS_PLATFORM_*'
      - 'tools/platform_*.py'
      - 'tools/validate_platform_self_reconciliation.py'
      - 'apps/research_os_laravel/**'
      - 'apps/research_os_flutter/**'
      - '.github/workflows/research-os-platform-production-certification.yml'
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python tools/validate_research_os_platform_production_certification.py
      - run: python -m unittest tools.test_validate_research_os_platform_production_certification -v
