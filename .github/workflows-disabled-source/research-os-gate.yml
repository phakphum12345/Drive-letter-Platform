name: Research OS Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact commit SHA to validate"
        required: false
        type: string

permissions:
  contents: read

# Do not cancel an in-flight final gate when another push/commit arrives.
# The gate must finish its required jobs so a cancelled child job is not
# misreported as a final-gate failure caused by concurrency cancellation.
concurrency:
  group: research-os-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  TARGET_SHA: ${{ github.event.pull_request.head.sha || inputs.target_sha || github.sha }}

jobs:
  python-quality:
    name: Python Build Test Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify checked-out SHA
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$actual"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compile Research OS
        run: python -m compileall -q v3/research_os_v3

      - name: Unit tests
        env:
          PYTHONPATH: v3
        run: |
          python -m unittest discover -s v3/tests -p 'test_*.py' -v

      - name: Import smoke
        env:
          PYTHONPATH: v3
        run: |
          python -c "import research_os_v3; print('research_os_v3 import: OK')"

      - name: Static analysis
        env:
          PYTHONPATH: v3
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path('v3/research_os_v3')
          files = sorted(root.glob('*.py'))
          assert files, 'no Research OS Python sources found'
          for path in files:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print(f'AST analysis passed: {len(files)} files')
          PY

  research-e2e:
    name: Research E2E
    needs: python-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify checked-out SHA
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$actual"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Research OS E2E tests
        env:
          PYTHONPATH: v3
        run: |
          python -m unittest discover -s v3/tests -p 'test_*e2e*.py' -v

      - name: Run autonomous/evidence integration tests
        env:
          PYTHONPATH: v3
        run: |
          python -m unittest \
            v3.tests.test_autonomous_research \
            v3.tests.test_tool_evidence \
            v3.tests.test_research_tool_adapters \
            -v

  flutter-quality:
    name: Flutter Analyze Test Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify checked-out SHA
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$actual"

      - name: Download and set up Flutter SDK
        uses: ./.github/actions/flutter-setup # vendored composite; nested actions pinned
        with:
          channel: stable
          cache: true

      # Recon runs immediately after SDK setup and before project generation,
      # dependency resolution, analysis, tests, or APK compilation.
      - name: Recon downloaded SDK and Android build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "=== RECON: SDK IDENTITY ==="
          flutter --version
          dart --version
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["RUNNER_TEMP"]) / "flutter-version.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          for key in ("frameworkVersion", "channel", "repositoryUrl", "frameworkRevision", "dartSdkVersion"):
              print(f"FLUTTER_RECON_{key.upper()}={data.get(key, 'UNKNOWN')}")
          assert data.get("frameworkRevision"), "Flutter framework revision is missing"
          assert data.get("dartSdkVersion"), "Dart SDK version is missing"
          PY

          echo "=== RECON: JAVA ==="
          java -version
          command -v java
          echo "JAVA_HOME=${JAVA_HOME:-UNSET}"

          echo "=== RECON: ANDROID SDK ==="
          echo "ANDROID_HOME=${ANDROID_HOME:-UNSET}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-UNSET}"
          doctor_status=0
          flutter doctor -v > "$RUNNER_TEMP/flutter-doctor.log" 2>&1 || doctor_status=$?
          cat "$RUNNER_TEMP/flutter-doctor.log"
          echo "FLUTTER_DOCTOR_EXIT_CODE=$doctor_status"
          # Doctor also checks unrelated desktop toolchains (GTK/CMake/etc.).
          # Do not fail an Android build merely because Linux desktop support is absent.
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          test -d "$sdk_root/platform-tools"
          test -d "$sdk_root/platforms"
          echo "RECON_ANDROID_SDK_LAYOUT=PASS"

          echo "=== RECON: SOURCE INPUTS (PRE-GENERATION) ==="
          test -f v3/flutter_app/pubspec.yaml
          test -f packages/research_os_contracts/pubspec.yaml
          echo "RECON_SOURCE_INPUTS=PASS"

          echo "=== RECON: MAVEN CENTRAL REACHABILITY ==="
          # Probe repository metadata, not a pinned artifact version. The actual
          # Gradle build below is authoritative for resolving project dependencies.
          url="https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/maven-metadata.xml"
          status="$(curl --silent --show-error --location --output "$RUNNER_TEMP/kotlin-stdlib-maven-metadata.xml" --write-out '%{http_code}' --max-time 30 "$url")"
          echo "MAVEN_CENTRAL_HTTP_STATUS=$status"
          if [[ "$status" != 2* ]]; then
            echo "::error::Maven Central metadata probe failed with HTTP $status; repository reachability could not be confirmed."
            exit 1
          fi
          test -s "$RUNNER_TEMP/kotlin-stdlib-maven-metadata.xml"
          grep -q '<metadata>' "$RUNNER_TEMP/kotlin-stdlib-maven-metadata.xml"
          echo "RECON_MAVEN_CENTRAL=PASS"
          echo "FLUTTER_POST_DOWNLOAD_RECON=PASS"

      - name: Generate Android platform
        working-directory: v3/flutter_app
        run: flutter create --platforms=android --project-name=research_os_v3_flutter .

      - name: Recon generated Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f v3/flutter_app/android/settings.gradle.kts
          test -f v3/flutter_app/android/gradle/wrapper/gradle-wrapper.properties
          echo "RECON_GENERATED_ANDROID_PROJECT=PASS"

      - name: Flutter dependencies
        working-directory: v3/flutter_app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: v3/flutter_app
        run: flutter analyze

      - name: Flutter tests
        working-directory: v3/flutter_app
        run: flutter test

      - name: Flutter debug APK build
        working-directory: v3/flutter_app
        run: flutter build apk --debug

  linux-desktop-quality:
    name: Flutter Linux Desktop Recon Build
    needs: [python-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify checked-out SHA
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$actual"
      - name: Download and set up Flutter SDK
        uses: ./.github/actions/flutter-setup
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev mesa-utils
      - name: Recon Linux desktop toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          command -v clang
          command -v cmake
          command -v ninja
          command -v pkg-config
          pkg-config --modversion gtk+-3.0
          echo "RECON_LINUX_DESKTOP_TOOLCHAIN=PASS"
      - name: Generate Linux platform
        working-directory: v3/flutter_app
        run: flutter create --platforms=linux --project-name=research_os_v3_flutter .
      - name: Recon generated Linux project
        run: |
          set -euo pipefail
          test -f v3/flutter_app/linux/CMakeLists.txt
          test -f v3/flutter_app/linux/runner/main.cc
          echo "RECON_GENERATED_LINUX_PROJECT=PASS"
      - name: Flutter dependencies
        working-directory: v3/flutter_app
        run: flutter pub get
      - name: Flutter analyze
        working-directory: v3/flutter_app
        run: flutter analyze
      - name: Flutter tests
        working-directory: v3/flutter_app
        run: flutter test
      - name: Flutter Linux desktop build
        working-directory: v3/flutter_app
        run: flutter build linux --debug

  apple-quality:
    name: Flutter macOS and iOS Xcode Recon Build
    needs: [python-quality]
    runs-on: macos-latest
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Verify checked-out SHA
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "CHECKED_OUT_SHA=$actual"
      - name: Download and set up Flutter SDK
        uses: ./.github/actions/flutter-setup
        with:
          channel: stable
          cache: true
      - name: Recon Xcode and Apple SDKs
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun --sdk macosx --show-sdk-version
          pod --version
          echo "RECON_XCODE_TOOLCHAIN=PASS"
      - name: Generate Apple platforms
        working-directory: v3/flutter_app
        run: flutter create --platforms=ios,macos --project-name=research_os_v3_flutter .
      - name: Recon generated Apple projects
        run: |
          set -euo pipefail
          test -f v3/flutter_app/ios/Runner.xcodeproj/project.pbxproj
          test -f v3/flutter_app/macos/Runner.xcodeproj/project.pbxproj
          echo "RECON_GENERATED_APPLE_PROJECTS=PASS"
      - name: Flutter dependencies
        working-directory: v3/flutter_app
        run: flutter pub get
      - name: Flutter analyze
        working-directory: v3/flutter_app
        run: flutter analyze
      - name: Flutter tests
        working-directory: v3/flutter_app
        run: flutter test
      - name: Flutter iOS Simulator build
        working-directory: v3/flutter_app
        run: flutter build ios --simulator --debug
      - name: Package iOS Simulator build with exact-SHA evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          app_path="v3/flutter_app/build/ios/iphonesimulator/Runner.app"
          output_dir="$RUNNER_TEMP/research-os-ios-simulator-artifact"
          archive="$output_dir/Runner.app.zip"
          manifest="$output_dir/ios-simulator-build-manifest.json"

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -d "$app_path"
          test -f "$app_path/Info.plist"
          mkdir -p "$output_dir"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$archive"
          test -s "$archive"
          archive_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test -n "$archive_sha256"

          SOURCE_SHA="$SOURCE_SHA" ARCHIVE_SHA256="$archive_sha256" ARCHIVE_BYTES="$(stat -f%z "$archive")" MANIFEST_PATH="$manifest" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "schema_version": 1,
              "artifact_type": "ios-simulator-app",
              "source_sha": os.environ["SOURCE_SHA"],
              "bundle_relative_path": "v3/flutter_app/build/ios/iphonesimulator/Runner.app",
              "archive_file": "Runner.app.zip",
              "archive_sha256": os.environ["ARCHIVE_SHA256"],
              "archive_size_bytes": int(os.environ["ARCHIVE_BYTES"]),
              "build_command": "flutter build ios --simulator --debug",
              "signing": "simulator-build; not an iOS device IPA",
          }
          Path(os.environ["MANIFEST_PATH"]).write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"IOS_SIMULATOR_SOURCE_SHA={manifest['source_sha']}")
          print(f"IOS_SIMULATOR_ARCHIVE_SHA256={manifest['archive_sha256']}")
          print(f"IOS_SIMULATOR_ARCHIVE_BYTES={manifest['archive_size_bytes']}")
          PY
          echo "IOS_SIMULATOR_ARTIFACT_READY=PASS"
      - name: Upload iOS Simulator artifact and manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: research-os-ios-simulator-${{ env.TARGET_SHA }}
          path: |
            ${{ runner.temp }}/research-os-ios-simulator-artifact/Runner.app.zip
            ${{ runner.temp }}/research-os-ios-simulator-artifact/ios-simulator-build-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Flutter macOS desktop build
        working-directory: v3/flutter_app
        run: flutter build macos --debug

  gate:
    name: Research OS Final Gate
    needs: [python-quality, research-e2e, flutter-quality, linux-desktop-quality, apple-quality]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          echo "python-quality=${{ needs.python-quality.result }}"
          echo "research-e2e=${{ needs.research-e2e.result }}"
          echo "flutter-quality=${{ needs.flutter-quality.result }}"
          echo "linux-desktop-quality=${{ needs.linux-desktop-quality.result }}"
          echo "apple-quality=${{ needs.apple-quality.result }}"
          test "${{ needs.python-quality.result }}" = success
          test "${{ needs.research-e2e.result }}" = success
          test "${{ needs.flutter-quality.result }}" = success
          test "${{ needs.linux-desktop-quality.result }}" = success
          test "${{ needs.apple-quality.result }}" = success
          echo "RESEARCH_OS_GATE=PASS"
